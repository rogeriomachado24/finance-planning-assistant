# Runs on every push and pull request. No language model is needed: the tests force the
# mock chat provider, so results are the same on any machine.
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (lint, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Tests (domain, database, services, API, chat)
        run: pytest

  frontend:
    name: Frontend (types, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Generated API types match the committed OpenAPI description
        run: npm run api:types && git diff --exit-code src/api/schema.d.ts
      - name: Tests
        run: npm test
      - name: Type check and build
        run: npm run build
